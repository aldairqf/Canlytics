<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Canlytics">
  <defs>
    <linearGradient id="canlyticsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E74E6"/>
      <stop offset="1" stop-color="#13C6C9"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="24" y="24" width="208" height="208" rx="52" fill="url(#canlyticsBg)"/>

  <!-- "C" monogram (Canlytics / a nod to CAN) -->
  <path d="M183 176 A74 74 0 1 1 183 80"
        fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>

  <!-- CAN digital signal exiting the opening -->
  <path d="M104 128 H132 V104 H160 V128 H206"
        fill="none" stroke="#FFFFFF" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data node -->
  <circle cx="206" cy="128" r="11" fill="#FFFFFF"/>
  <circle cx="206" cy="128" r="4.5" fill="#1E74E6"/>
</svg>
