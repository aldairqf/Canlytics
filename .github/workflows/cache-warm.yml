name: Warm dependency cache

# release.yml only triggers on tag pushes, and GitHub Actions scopes each tag
# as its own isolated cache -- a tag can never reuse another tag's cache.
# Caches created on the default branch (master) ARE inherited as a fallback
# by every other ref, including tags. This workflow installs dependencies
# (no build) on every push to master so release builds start from a warm
# cache instead of a cold one every time.

on:
  push:
    branches: [master]

jobs:
  warm-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

  warm-linux:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim-bullseye
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: linux-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: linux-pip-

      - run: python -m pip install -r requirements.txt

  warm-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt
