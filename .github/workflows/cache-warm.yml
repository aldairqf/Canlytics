name: Warm dependency cache

# Keeps master's pip cache warm so release.yml's tag-triggered builds inherit
# it (GitHub isolates each tag's own cache, but every ref can fall back to the
# default branch's). Only runs when requirements.txt changes -- that's the
# only time the cache actually needs refreshing.

on:
  push:
    branches: [master]
    paths:
      - requirements.txt

jobs:
  warm-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

  warm-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: python -m pip install -r requirements.txt

  warm-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt
