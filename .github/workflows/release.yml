name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build Canlytics.spec

      - name: Zip onedir build
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Path dist -Directory | Select-Object -First 1
          Compress-Archive -Path $dir.FullName -DestinationPath "dist/$($dir.Name).zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dir
          path: dist/*-dir.zip

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim-bullseye
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils zip \
            libgl1-mesa-dev libglib2.0-0 libdbus-1-3 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxkbcommon-x11-0

      - uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: linux-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: linux-pip-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build Canlytics.spec

      - name: Zip onedir build
        run: |
          dir=$(find dist -mindepth 1 -maxdepth 1 -type d | head -1)
          (cd dist && zip -r "$(basename "$dir").zip" "$(basename "$dir")")

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/Canlytics-*-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dir
          path: dist/*-dir.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build Canlytics.spec

      - name: Zip onedir build
        run: |
          dir=$(find dist -mindepth 1 -maxdepth 1 -type d | head -1)
          (cd dist && zip -r "$(basename "$dir").zip" "$(basename "$dir")")

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: dist/Canlytics-*-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dir
          path: dist/*-dir.zip

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            windows-exe/*.exe
            windows-dir/*.zip
            linux-binary/Canlytics-*-linux-x64
            linux-dir/*.zip
            macos-binary/Canlytics-*-macos-arm64
            macos-dir/*.zip
